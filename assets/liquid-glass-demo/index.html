<!doctype html>
<html lang="en" data-wp="aurora" data-color="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Liquid glass button system — token-driven tints, sizes and shapes with calm, Apple-HIG-aligned motion.">
<title>Liquid Glass Studio — buttons & icon animation</title>
<script>
  /* apply ?wp= &color= &state= before first paint */
  (() => {
    const q = new URLSearchParams(location.search);
    const d = document.documentElement;
    if (q.get('wp'))    d.dataset.wp    = q.get('wp');
    if (q.get('color')) d.dataset.color = q.get('color');
    if (q.get('state') === 'protos')  d.dataset.stage = 'protos';
    if (q.get('state') === 'hover')   d.dataset.force = 'hover';
    if (q.get('state') === 'pressed') d.dataset.force = 'pressed';
  })();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   PAGE DEFAULTS — the dock writes data-color here, every unstyled
   .lg on the page inherits it.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --spring: cubic-bezier(.3,1.12,.35,1);
  --ease:   cubic-bezier(.4,.1,.2,1);
  --label: #1c1c1e;
  /* page-level tint (overridden per-button with .lg--<tint>) */
  --tint: 150 190 255;
  --deep: #2456c4;
  --dotc: 36 86 196;
}
html[data-color="clear"] { --tint:255 255 255; --deep:#2c2c2e; --dotc:28 28 30; }
html[data-color="blue"]  { --tint:150 190 255; --deep:#2456c4; --dotc:36 86 196; }
html[data-color="pink"]  { --tint:255 170 215; --deep:#c94d86; --dotc:201 77 134; }
html[data-color="mint"]  { --tint:160 236 195; --deep:#12855a; --dotc:18 133 90; }
html[data-color="amber"] { --tint:255 205 135; --deep:#a86a10; --dotc:168 106 16; }
html[data-color="ink"]   { --tint:32 34 42;    --deep:#f2f3f7; --dotc:255 255 255; }

*{ box-sizing:border-box; margin:0; }
html,body{ height:100%; }
body{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue","Liberation Sans",system-ui,sans-serif;
  color:var(--label); overflow:hidden;
}

/* Familiarity: everyone gets a visible focus indicator */
:focus-visible{ outline:3px solid rgb(var(--dotc,28 28 30) / .55); outline-offset:3px; border-radius:8px; }
.lg:focus-visible{ outline-offset:8px; }

/* ═══════════════════════════════════════════════════════════════
   LIQUID GLASS COMPONENT — every knob is a token.
   Copy the .lg block, tweak vars, or add a modifier below.
   ═══════════════════════════════════════════════════════════════ */
.lg{
  /* ── shape ─────────────────────────────── */
  --radius: 999px;            /* pill; circle overrides to 50% */
  --pad-x: 1.9em;
  --pad-y: .82em;
  --fs: clamp(20px, 1.1rem + 1.6vw, 44px); /* scales with user zoom */
  /* ── glass ─────────────────────────────── */
  --blur: 12px;
  --sat: 1.8;
  --tint: 255 255 255;        /* glass fill (rgb triplet) */
  --deep: #2c2c2e;            /* label / icon color — echoes tint */
  --dotc: 28 28 30;           /* dots, focus ring, colored shadow */
  /* ── motion ────────────────────────────── */
  --spring: cubic-bezier(.3,1.12,.35,1);
  --ease: cubic-bezier(.4,.1,.2,1);
  --press: .97;               /* pressed scale */
  --hover-lift: -1px;         /* hover raise */
  /* ── internals ─────────────────────────── */
  position:relative; isolation:isolate;
  border:0; padding:var(--pad-y) var(--pad-x); cursor:pointer;
  background:transparent; color:var(--deep);
  border-radius:var(--radius);
  font-family:inherit; font-size:var(--fs); font-weight:600;
  letter-spacing:-.015em; line-height:1;
  -webkit-tap-highlight-color:transparent;
  touch-action: manipulation;   /* no double-tap zoom delay */
  user-select: none;
  --pscale:1; --lift:0px;
  transform: translateY(var(--lift)) scale(var(--pscale));
  transition: transform .4s var(--spring), color .35s ease;
  will-change: transform;
}
.lg:focus-visible{ outline:3px solid rgb(var(--dotc) / .55); outline-offset:8px; }
@media (hover:hover){ .lg:hover{ --lift: var(--hover-lift); } }
.lg:active, .lg.is-pressed{ --pscale:var(--press); --lift:1.5px; transition-duration:.09s; }
/* Agency/craft: a single quiet settle on release — the defining moment */
.lg.settle{ animation: settle .42s var(--spring); }
@keyframes settle{
  0%{ transform: translateY(1.5px) scale(var(--press)); }
  55%{ transform: translateY(-.5px) scale(1.012); }
  100%{ transform: translateY(0) scale(1); }
}

/* ── fx: one-shot sheen (opt-in via .lg--sheen; pointer devices only) ── */
.lg--sheen .lg-sheen{ display:block; }
@media (hover:hover){
  .lg--sheen:hover .lg-sheen{ animation: sweep .9s var(--ease) forwards; }
}
@keyframes sweep{
  from{ transform:translateX(-135%) skewX(-8deg); }
  to  { transform:translateX(135%)  skewX(-8deg); }
}

/* ── glass slab ─────────────────────────── */
.lg-slab{
  position:absolute; inset:0; z-index:1; border-radius:inherit;
  pointer-events:none; overflow:hidden;
  background:
    radial-gradient(130% 105% at 50% -12%,
      rgb(var(--tint) / .92),
      rgb(var(--tint) / .34) 52%,
      rgb(var(--tint) / .08) 80%),
    linear-gradient(180deg, rgb(255 255 255 / .40), rgb(255 255 255 / .05) 58%, rgb(var(--tint) / .22));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  box-shadow:
    inset 0 1.5px 1px rgb(255 255 255 / .95),
    inset 0 -2px 5px rgb(0 0 0 / .10),
    inset 3px 0 5px rgb(255 255 255 / .28),
    inset -3px 0 5px rgb(255 255 255 / .28),
    0 26px 40px -18px rgb(0 0 0 / .35),
    0 5px 12px rgb(0 0 0 / .06),
    0 14px 30px -14px rgb(var(--dotc) / .30);   /* colored bloom echoes tint */
  transition: box-shadow .35s ease;
}
.lg-slab::before{  /* light-catching rim */
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
  background:linear-gradient(150deg,
    rgb(255 255 255 / .95), rgb(255 255 255 / .18) 38%,
    rgb(255 255 255 / .05) 62%, rgb(255 255 255 / .55));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}
.lg.is-pressed .lg-slab{
  box-shadow:
    inset 0 1.5px 1px rgb(255 255 255 / .95),
    inset 0 -2px 5px rgb(0 0 0 / .13),
    inset 3px 0 5px rgb(255 255 255 / .26),
    inset -3px 0 5px rgb(255 255 255 / .26),
    0 10px 16px -10px rgb(0 0 0 / .32),
    0 2px 6px rgb(0 0 0 / .06),
    0 6px 14px -8px rgb(var(--dotc) / .25);
}

/* ── press dot texture ──────────────────── */
.lg-dots{
  position:absolute; inset:0; z-index:2; border-radius:inherit; pointer-events:none;
  background-image: radial-gradient(rgb(var(--dotc) / .08) 1px, transparent 1.3px);
  background-size: 13px 13px;
  opacity:0; transition: opacity .22s ease;
}
.lg.is-pressed .lg-dots{ opacity:1; }

/* ── clipped sheen + cursor glow ────────── */
.lg-clip{
  position:absolute; inset:0; z-index:3; border-radius:inherit;
  overflow:hidden; pointer-events:none;
}
.lg-sheen{
  display:none; position:absolute; inset:-45% -60%;
  background:linear-gradient(104deg, transparent 40%, rgb(255 255 255 / .28) 46%,
                  rgb(255 255 255 / .85) 50%, rgb(255 255 255 / .28) 54%, transparent 60%);
  filter: blur(6px); mix-blend-mode: plus-lighter;
  transform: translateX(-135%) skewX(-8deg);
}
.lg-glow{
  position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: radial-gradient(110px 80px at var(--mx,50%) var(--my,50%),
              rgb(255 255 255 / .4), transparent 72%);
  opacity:0; transition: opacity .35s ease; mix-blend-mode: plus-lighter;
}
.lg--glow .lg-glow{ display:block; }
@media (hover:hover){
  .lg--glow:hover .lg-glow{ opacity:1; }
}

/* ── label ──────────────────────────────── */
.lg-label{
  position:relative; z-index:4; display:block;
  text-shadow: 0 1px 0 rgb(255 255 255 / .45), 0 12px 22px rgb(var(--dotc) / .28);
  transition: text-shadow .35s ease, color .35s ease;
}
html[data-color="ink"] .hero .lg-label{ text-shadow:0 1px 0 rgb(255 255 255 / .12), 0 12px 22px rgb(0 0 0 / .5); }
.lg.is-pressed .lg-label{
  color: rgb(var(--dotc) / .72);
  text-shadow: 0 1px 0 rgb(255 255 255 / .35), 0 5px 10px rgb(var(--dotc) / .18);
}

/* ═══ MODIFIERS — tint (deep = hue-matched text/accent) ═══ */
.lg--clear { --tint:255 255 255; --deep:#2c2c2e; --dotc:28 28 30; }
.lg--blue  { --tint:150 190 255; --deep:#2456c4; --dotc:36 86 196; }
.lg--pink  { --tint:255 170 215; --deep:#c94d86; --dotc:201 77 134; }
.lg--mint  { --tint:160 236 195; --deep:#12855a; --dotc:18 133 90; }
.lg--amber { --tint:255 205 135; --deep:#a86a10; --dotc:168 106 16; }
.lg--ink   { --tint:32 34 42;    --deep:#f2f3f7; --dotc:255 255 255; }

/* ═══ MODIFIERS — size ═══ */
.lg--xl{ --fs:58px; }
.lg--lg{ --fs:44px; }
.lg--md{ --fs:28px; }
.lg--sm{ --fs:17px; --pad-x:1.5em; --pad-y:.7em; }

/* ═══ MODIFIERS — shape ═══ */
.lg--circle{
  --radius:50%; padding:0; display:grid; place-items:center;
  width:96px; height:96px;
}
.lg--circle.lg--md{ width:72px; height:72px; }
.lg--circle.lg--sm{ width:52px; height:52px; }
.lg--circle .lg-label{ display:grid; place-items:center; }
.lg--circle svg{ width:44%; height:44%; }
.lg--circle.lg--sm svg{ width:46%; height:46%; }

/* ═══ WALLPAPERS (unchanged system) ═══ */
.wp{ position:fixed; inset:0; opacity:0; pointer-events:none; transition: opacity .9s ease; overflow:hidden; }
html[data-wp="mono"] .wp-mono,
html[data-wp="aurora"] .wp-aurora,
html[data-wp="sunset"] .wp-sunset,
html[data-wp="ocean"] .wp-ocean,
html[data-wp="midnight"] .wp-midnight{ opacity:1; }
.wp-mono{ background:#e9e9e7; }
.wp-mono::after{ content:""; position:absolute; inset:0;
  background:radial-gradient(120% 90% at 50% 8%, rgba(255,255,255,.7), transparent 60%); }
.wp-aurora{ background:linear-gradient(160deg,#eceef2,#e3e6ea); }
.wp-aurora .blob, .wp-sunset .blob, .wp-ocean .blob, .wp-midnight .blob{
  position:absolute; border-radius:50%; filter:blur(75px); }
.wp-aurora .b1{ width:560px;height:560px; background:#8ab6ff; top:-160px; left:-140px;  opacity:.85; animation:drift 30s ease-in-out infinite alternate; }
.wp-aurora .b2{ width:480px;height:480px; background:#ffb2e0; bottom:-130px; right:-110px; opacity:.85; animation:drift 34s ease-in-out infinite alternate-reverse; }
.wp-aurora .b3{ width:400px;height:400px; background:#a8f0c8; top:40%; left:56%;        opacity:.85; animation:drift 28s ease-in-out infinite alternate; }
.wp-sunset{ background:linear-gradient(165deg,#ffe7c4 0%,#ffc2a1 38%,#f490b4 68%,#a96bd8 100%); }
.wp-sunset .b1{ width:640px;height:640px; background:#ff9a56; top:-180px; right:-160px; opacity:.7; animation:drift 32s ease-in-out infinite alternate; }
.wp-sunset .b2{ width:520px;height:520px; background:#ff5e8a; bottom:-160px; left:-120px; opacity:.7; animation:drift 30s ease-in-out infinite alternate-reverse; }
.wp-sunset .b3{ width:420px;height:420px; background:#8a5cff; top:44%; left:38%;        opacity:.7; animation:drift 36s ease-in-out infinite alternate; }
.wp-ocean{ background:linear-gradient(180deg,#dff3f6,#bfe3ee 55%,#9cc8e8); }
.wp-ocean .b1{ width:600px;height:600px; background:#57c7d8; top:-160px; left:30%;      opacity:.8; animation:drift 32s ease-in-out infinite alternate; }
.wp-ocean .b2{ width:460px;height:460px; background:#5a8fe0; bottom:-140px; right:-100px; opacity:.8; animation:drift 28s ease-in-out infinite alternate-reverse; }
.wp-ocean .b3{ width:380px;height:380px; background:#7de3c8; top:52%; left:8%;          opacity:.8; animation:drift 30s ease-in-out infinite alternate; }
.wp-midnight{ background:radial-gradient(140% 120% at 50% 0%, #171a26, #0a0c12 70%); }
.wp-midnight .b1{ width:640px;height:640px; background:#3b5bff; top:-200px; left:-140px; opacity:.5; animation:drift 36s ease-in-out infinite alternate; }
.wp-midnight .b2{ width:520px;height:520px; background:#8a2be2; bottom:-180px; right:-120px; opacity:.5; animation:drift 30s ease-in-out infinite alternate-reverse; }
.wp-midnight .b3{ width:400px;height:400px; background:#00c8ff; top:48%; left:52%;      opacity:.5; animation:drift 30s ease-in-out infinite alternate; }
@keyframes drift{ to{ transform:translate(20px,12px) scale(1.04); } }
html[data-wp="midnight"] .caption{ color:rgba(235,238,255,.4); }
html[data-wp="midnight"] .showcase h2{ color:#cfd2e0; }

/* ═══ STAGES ═══ */
.stage{ position:fixed; inset:0; display:grid; place-items:center; transition: opacity .6s ease; }
html[data-stage="protos"] .hero{ opacity:0; pointer-events:none; }
html:not([data-stage="protos"]) .protos{ opacity:0; pointer-events:none; }
.caption{ position:absolute; top:30px; left:0; right:0; text-align:center;
  font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#9a9a97;
  transition: opacity .8s ease; }
.plabel{ transition: opacity .8s ease; }
/* Agency: UI steps aside after 4s of stillness, returns on any activity */
body.idle .caption, body.idle .plabel{ opacity:0; }

/* forced states for deterministic screenshots (?state=hover|pressed) */
html[data-force="hover"] .hero .lg{ --lift:var(--hover-lift); }
html[data-force="pressed"] .hero .lg{ --pscale:var(--press); --lift:1.5px; transition:none; }
html[data-force="pressed"] .hero .lg .lg-slab{
  box-shadow:
    inset 0 1.5px 1px rgb(255 255 255 / .95),
    inset 0 -2px 5px rgb(0 0 0 / .13),
    inset 3px 0 5px rgb(255 255 255 / .26),
    inset -3px 0 5px rgb(255 255 255 / .26),
    0 10px 16px -10px rgb(0 0 0 / .32),
    0 2px 6px rgb(0 0 0 / .06),
    0 6px 14px -8px rgb(var(--dotc) / .25);
}
html[data-force="pressed"] .hero .lg .lg-dots{ opacity:1; }
html[data-force="pressed"] .hero .lg .lg-label{ color: rgb(var(--dotc) / .72); }

.lg-tilt{ perspective:750px; }

/* ═══ PROTOTYPES GRID ═══ */
.protos-inner{
  display:flex; flex-direction:column; align-items:center; gap:44px;
  max-height:92vh; overflow:auto; padding:30px 20px 120px;
}
.protos h2{
  font-size:14px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:#5c5c5f; text-align:center;
}
.pgroup{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; justify-content:center; }
.plabel{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#9a9a97; text-align:center; margin-top:-26px; }

/* icon tiles (follow page tint) */
.glass-tile{
  width:96px; height:96px; border-radius:28px; border:0; padding:0; cursor:pointer;
  display:grid; place-items:center; position:relative; isolation:isolate; overflow:hidden;
  color:var(--deep);
  background:rgb(var(--tint) / .24);
  backdrop-filter: blur(11px) saturate(1.7);
  -webkit-backdrop-filter: blur(11px) saturate(1.7);
  box-shadow:
    inset 0 1.5px 1px rgb(255 255 255 / .9),
    inset 0 -2px 4px rgb(0 0 0 / .08),
    0 20px 30px -16px rgb(0 0 0 / .4),
    0 10px 24px -12px rgb(var(--dotc) / .25);
  transition: transform .4s var(--spring);
}
.glass-tile::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.2px;
  background:linear-gradient(150deg, rgb(255 255 255 / .9), rgb(255 255 255 / .1) 45%, rgb(255 255 255 / .5));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}
@media (hover:hover){
  .glass-tile:hover{ transform: translateY(-2px) scale(1.02); }
  .glass-tile:hover .tri{ transform: scale(1.05) rotate(3deg); }
  .glass-tile:hover .heart{ transform: scale(1.07); transform-origin:50% 55%; }
}
.glass-tile:active{ transform: scale(.96); transition:transform .1s ease-out; }
.glass-tile .tri, .glass-tile .heart{ transform-origin:50% 50%; transition: transform .3s var(--spring); }

/* plus → check morph */
.btn-ico{ position:relative; width:1.05em; height:1.05em; display:inline-block; }
.btn-ico svg{ position:absolute; inset:0; transition: opacity .25s ease, transform .4s var(--spring); }
.ico-check{ opacity:0; transform: rotate(-50deg) scale(.4); }
.lg:hover .ico-plus{ opacity:0; transform: rotate(95deg) scale(.4); }
.lg:hover .ico-check{ opacity:1; transform: rotate(0) scale(1); }

/* ═══ DOCK ═══ */
.dock{
  position:fixed; bottom:34px; left:50%; transform:translateX(-50%);
  z-index:10; display:flex; align-items:center; gap:14px;
  padding:11px 18px; border-radius:999px;
  background:rgb(255 255 255 / .35);
  backdrop-filter: blur(14px) saturate(1.6);
  -webkit-backdrop-filter: blur(14px) saturate(1.6);
  box-shadow:
    inset 0 1px 1px rgb(255 255 255 / .8),
    inset 0 -1px 3px rgb(0 0 0 / .06),
    0 16px 32px -14px rgb(0 0 0 / .4);
  border:1px solid rgb(255 255 255 / .5);
}
html[data-wp="midnight"] .dock{ background:rgb(22 24 34 / .45); border-color:rgb(255 255 255 / .14); }
.dock .grp{ display:flex; gap:10px; }
.dock .div{ width:1px; height:26px; background:rgb(0 0 0 / .14); }
html[data-wp="midnight"] .dock .div{ background:rgb(255 255 255 / .16); }
.chip{
  width:34px; height:34px; border-radius:50%; border:0; cursor:pointer; padding:0;
  position:relative;                 /* anchor for the oversized hit area */
  touch-action: manipulation;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1), 0 2px 5px rgb(0 0 0 / .15);
  transition: transform .35s var(--spring), box-shadow .2s ease;
}
.chip::after{                       /* 44px effective touch target (HIG) */
  content:""; position:absolute; inset:-6px; border-radius:50%;
}
@media (hover:hover){ .chip:hover{ transform: scale(1.1); } }
.chip.on{
  transform: scale(1.05);
  box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px rgb(0 0 0 / .25), 0 3px 7px rgb(0 0 0 / .2);
}
html[data-wp="midnight"] .chip.on{ box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px rgb(255 255 255 / .3), 0 3px 7px rgb(0 0 0 / .4); }
.chip[data-wp="mono"]{ background:linear-gradient(135deg,#f4f4f2,#d9d9d6); }
.chip[data-wp="aurora"]{ background:linear-gradient(135deg,#8ab6ff 0%,#ffb2e0 55%,#a8f0c8 100%); }
.chip[data-wp="sunset"]{ background:linear-gradient(135deg,#ffc2a1,#f4789f 55%,#a96bd8); }
.chip[data-wp="ocean"]{ background:linear-gradient(135deg,#57c7d8,#7de3c8 55%,#5a8fe0); }
.chip[data-wp="midnight"]{ background:linear-gradient(135deg,#171a26,#3b5bff 60%,#8a2be2); }
.chip[data-color="clear"]{ background:linear-gradient(135deg,#ffffff,#e8e8e6); }
.chip[data-color="blue"]{ background:linear-gradient(135deg,#bcd2ff,#8cb4ff); }
.chip[data-color="pink"]{ background:linear-gradient(135deg,#ffd0e8,#ffa8d4); }
.chip[data-color="mint"]{ background:linear-gradient(135deg,#d2f7e2,#98ebc0); }
.chip[data-color="amber"]{ background:linear-gradient(135deg,#ffe4b8,#ffca84); }
.chip[data-color="ink"]{ background:linear-gradient(135deg,#3a3d46,#17181d); }
.chip.txt{
  width:auto; padding:0 14px; height:34px; border-radius:999px;
  font-family:inherit; font-size:12.5px; font-weight:600; letter-spacing:.02em;
  color:#2c2c2e; background:rgb(255 255 255 / .55);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06), 0 1px 3px rgb(0 0 0 / .08);
}
.chip.txt.on{ background:#1c1c1e; color:#fff; box-shadow:0 3px 8px rgb(0 0 0 / .25); }
.chip:active{ transform: scale(.94); transition:transform .08s ease-out; }
html[data-wp="midnight"] .chip.txt{ background:rgb(255 255 255 / .12); color:#e8eaf2; }
html[data-wp="midnight"] .chip.txt.on{ background:#f2f3f7; color:#14151c; }

/* Flexibility: stronger separation when the system asks for contrast */
@media (prefers-contrast: more){
  .lg-slab, .glass-tile, .dock{ border:1px solid rgb(0 0 0 / .35); }
  .caption, .plabel{ color:#3a3a3c; letter-spacing:.12em; }
  .lg-label{ text-shadow:none; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<div class="wp wp-mono" aria-hidden="true"></div>
<div class="wp wp-aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="wp wp-sunset" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="wp wp-ocean" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="wp wp-midnight" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<!-- ═══════════ HERO CTA ═══════════ -->
<section class="stage hero">
  <div class="caption">Liquid Glass — hover, press, personalize</div>
  <div class="lg-tilt">
    <button class="lg lg--lg lg--glow" id="mainBtn" aria-label="Get now">
      <span class="lg-slab" aria-hidden="true"></span>

    <button class="chip" data-color="pink"  title="Pink"></button>

    <button class="chip" data-color="amber" title="Amber"></button>
    <button class="chip" data-color="ink"   title="Ink"></button>
  </div>

<script>
  const root = document.documentElement;

  /* dock wiring — chips act as radio toggles (aria-pressed kept in sync) */
  function syncChips(){
    document.querySelectorAll('#sGrp .chip').forEach(c => {
      const on = (c.dataset.stage === 'protos') === (root.dataset.stage === 'protos');
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
    });
    document.querySelectorAll('#wpGrp .chip').forEach(c => {
      const on = c.dataset.wp === root.dataset.wp;
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
    });
    document.querySelectorAll('#cGrp .chip').forEach(c => {
      const on = c.dataset.color === root.dataset.color;
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
    });
  }
  document.querySelectorAll('#sGrp .chip').forEach(c =>
    c.addEventListener('click', () => {
      if (c.dataset.stage === 'protos') root.dataset.stage = 'protos';
      else delete root.dataset.stage;
      syncChips();
    }));
  document.querySelectorAll('#wpGrp .chip').forEach(c =>
    c.addEventListener('click', () => { root.dataset.wp = c.dataset.wp; syncChips(); }));
  document.querySelectorAll('#cGrp .chip').forEach(c =>
    c.addEventListener('click', () => { root.dataset.color = c.dataset.color; syncChips(); }));
  syncChips();

  /* Flexibility: arrow keys move within a dock group */
  document.querySelectorAll('.dock .grp').forEach(grp => {
    grp.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const chips = [...grp.querySelectorAll('.chip')];
      const i = chips.indexOf(document.activeElement);
      if (i < 0) return;
      const next = chips[(i + (e.key === 'ArrowRight' ? 1 : chips.length - 1)) % chips.length];
      next.focus(); next.click();
      e.preventDefault();
    });
  });

  /* press logic + single quiet settle on release */
  document.querySelectorAll('.lg').forEach(btn => {
    btn.addEventListener('pointerdown', () => {
      btn.classList.remove('settle');
      btn.classList.add('is-pressed');
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev =>
      btn.addEventListener(ev, () => {
        if (btn.classList.contains('is-pressed')) {
          btn.classList.remove('is-pressed');
          btn.classList.add('settle');
          btn.addEventListener('animationend', () => btn.classList.remove('settle'), { once:true });
        }
      }));
  });

  /* cursor glow (pointer:fine only) */
  if (matchMedia('(pointer:fine)').matches) document.querySelectorAll('.lg--glow').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  /* Agency: captions step aside while you're just looking */
  let idleT;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => document.body.classList.add('idle'), 4000);
  };
  ['pointermove','pointerdown','keydown'].forEach(ev => addEventListener(ev, wake, { passive:true }));
  wake();
</script>
