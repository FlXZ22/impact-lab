<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Auto-playing loop: unchecked -> checked -> unchecked (3.2s cycle).
       Recolor by editing fill="#0DB647". -->
  <defs>
    <clipPath id="boxclip">
      <rect x="-24" y="-24" width="48" height="48" rx="14"/>
    </clipPath>
  </defs>

  <!-- everything is centered on (32,32) so scale/rotate pivot correctly -->
  <g transform="translate(32,32)">

    <!-- outline of the empty box -->
    <rect x="-22.5" y="-22.5" width="45" height="45" rx="13"
          fill="none" stroke="#000" stroke-width="3" opacity="1">
      <animate attributeName="opacity"
        values="1;1;0;0;1;1" keyTimes="0;0.04;0.09;0.66;0.73;1"
        dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keySplines="0 0 1 1;.4 0 .6 1;0 0 1 1;.4 0 .6 1;0 0 1 1"/>
    </rect>

    <!-- colored box: pops in with overshoot, slight rotation, eases out -->
    <g>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="-8;3;0;0;0;5;0" keyTimes="0;0.04;0.10;0.15;0.55;0.60;0.66"
        dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keySplines="0 0 1 1;.34 1.4 .64 1;.3 0 .5 1;0 0 1 1;.4 0 .7 1;.3 0 .6 1"/>
      <animateTransform attributeName="transform" type="scale"
        values="0;0;1.12;1;1;1.08;0;0" keyTimes="0;0.04;0.10;0.15;0.55;0.60;0.66;1"
        dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keySplines="0 0 1 1;.34 1.56 .64 1;.3 0 .5 1;0 0 1 1;.34 1.4 .64 1;.5 0 .75 .5;0 0 1 1"/>
      <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#0DB647"/>
    </g>

    <!-- checkmark: starts drawing while the box is still settling,
         reverse-draws as the box shrinks away -->
    <g clip-path="url(#boxclip)">
      <polyline points="-12,1.5 -3.5,10 13,-7"
                fill="none" stroke="#fff" stroke-width="5.5"
                stroke-linecap="round" stroke-linejoin="round"
                stroke-dasharray="36" stroke-dashoffset="36">
        <animate attributeName="stroke-dashoffset"
          values="36;36;0;0;36;36" keyTimes="0;0.10;0.24;0.55;0.66;1"
          dur="3.2s" repeatCount="indefinite" calcMode="spline"
          keySplines="0 0 1 1;.25 .9 .35 1;0 0 1 1;.55 0 .8 .5;0 0 1 1"/>
      </polyline>
    </g>
  </g>
</svg>
