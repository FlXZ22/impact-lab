  <div class="app">
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/logo.png" width="144" height="28" alt="SegnalaMi">
      </a>
      <div class="topbar-actions">
        <button id="my-reports-button" class="pill-button" type="button" aria-haspopup="dialog" hidden>
          <svg class="icon asset" aria-hidden="true"><use href="#a-clock"/></svg>
          <span class="pill-label" data-i18n="myReports"></span>
          <span id="my-reports-count" class="pill-count"></span>
        </button>
        <button id="language" class="lang-toggle" type="button"></button>
      </div>
    </header>

    <main id="conversation" class="conversation" tabindex="-1">
      <ol id="messages" class="messages" data-i18n-label="conversationLabel"></ol>
    </main>

    <footer class="dock" id="dock">
      <p id="dock-note" class="dock-note" role="status" hidden></p>

      <div class="composer-card">
        <div id="attachment" class="attachment" hidden>
          <figure class="attachment-thumb">
            <img id="attachment-image" alt="">
            <span class="attachment-spinner" aria-hidden="true"></span>
          </figure>
          <span id="attachment-label" class="attachment-label"></span>
          <button id="attachment-remove" class="ghost-button" type="button" data-i18n-label="removePhoto">
            <svg class="icon asset" aria-hidden="true"><use href="#a-close"/></svg>
          </button>
        </div>

        <form id="composer" class="composer" novalidate>
          <label class="ghost-button" id="photo-button" data-i18n-title="addPhoto">
            <input id="photo-input" class="visually-hidden" type="file" accept="image/*">
            <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
            <span class="visually-hidden" data-i18n="addPhoto"></span>
          </label>

          <label class="visually-hidden" for="message-input" data-i18n="messageLabel"></label>
          <textarea id="message-input" rows="1" enterkeyhint="send" autocomplete="off" spellcheck="true" data-i18n-placeholder="placeholder"></textarea>

          <button id="send-button" class="send" type="submit" data-i18n-label="send" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
          </button>
          <button id="mic-button" class="ghost-button mic" type="button" aria-pressed="false" data-i18n-label="dictate">
            <svg class="icon asset" aria-hidden="true"><use href="#a-mic"/></svg>
          </button>
        </form>

        <div id="listening" class="listening" hidden>
          <button id="listen-cancel" class="ghost-button" type="button" data-i18n-label="cancelDictation">
            <svg class="icon asset" aria-hidden="true"><use href="#a-close"/></svg>
          </button>
          <div class="listening-panel">
            <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
            <span class="listening-label" id="listening-label">
              <span class="rec-dot" aria-hidden="true"></span>
              <span id="listening-text" data-i18n="listening"></span>
              <time id="listen-timer">0:00</time>
            </span>
          </div>
          <button id="listen-stop" class="send" type="button" data-i18n-label="stopDictation">
            <svg class="icon asset" aria-hidden="true"><use href="#a-done"/></svg>
          </button>
        </div>
      </div>
      <p class="dock-footnote" data-i18n="footnote"></p>
    </footer>
  </div>

  <dialog id="my-reports" class="sheet" aria-labelledby="my-reports-title">
    <div class="sheet-inner">
      <header class="sheet-head">
        <h2 id="my-reports-title" data-i18n="myReports"></h2>
        <button id="my-reports-close" class="ghost-button" type="button" data-i18n-label="close">
          <svg class="icon asset" aria-hidden="true"><use href="#a-close"/></svg>
        </button>
      </header>
      <p class="sheet-hint" data-i18n="myReportsHint"></p>
      <ol id="my-reports-list" class="tracked-list"></ol>
      <p id="my-reports-empty" class="sheet-empty" data-i18n="myReportsEmpty" hidden></p>
    </div>
  </dialog>

  <p id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
